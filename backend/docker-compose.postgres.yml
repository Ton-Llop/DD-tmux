# For the Postgres LXC/VM on Proxmox
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dungeon
      POSTGRES_PASSWORD: ${PG_PASSWORD:?define PG_PASSWORD}
      POSTGRES_DB: dungeon
    ports: ["5432:5432"]   # restrict to your LAN with the Proxmox firewall
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
