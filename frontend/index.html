<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DD-tmux</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23140f16'/><rect x='6' y='3' width='4' height='6' fill='%23ffb040'/><rect x='7' y='9' width='2' height='5' fill='%236b4a2a'/></svg>">
</head>
<body>
  <main id="rooms" class="rooms">
    <div class="empty" id="empty">
      <p>El torreón está vacío.</p>
      <p class="muted">Abre una sesión tmux o crea una sala.</p>
    </div>
  </main>
  <!-- Barra de abajo: estado a la izquierda, mapa de la mazmorra (una sala por sesión tmux) y controles -->
  <footer class="bar">
    <div class="bar-side">
      <div class="brand"><span class="flame"></span>DD<span class="dot">·</span>tmux</div>
      <div class="conn" id="conn"><i></i><span>desconectado</span></div>
      <div class="alerts" id="alerts" hidden></div>
    </div>
    <nav id="map" class="map" aria-label="Mapa de salas"></nav>
    <div class="bar-side end">
      <label class="toggle"><input type="checkbox" id="showShells"> shells</label>
      <button class="btn ghost" id="soundBtn" title="Sonido al pedir input">🔔</button>
      <button class="btn" id="newRoomBtn">+ Sala</button>
    </div>
  </footer>

  <!-- Panel lateral del personaje -->
  <aside id="panel" class="panel" hidden>
    <header class="panel-head">
      <div class="who">
        <div class="portrait" id="pPortrait"></div>
        <div>
          <div class="p-name" id="pName"></div>
          <div class="p-meta" id="pMeta"></div>
        </div>
      </div>
      <button class="btn ghost close" id="panelClose" aria-label="Cerrar">✕</button>
    </header>
    <nav class="tabs">
      <button data-tab="term" class="on">Terminal</button>
      <button data-tab="char">Personaje</button>
      <button data-tab="hist">Crónica</button>
    </nav>

    <section class="tab tab-term on" data-tab="term">
      <div class="term-wrap"><div id="term"></div></div>
      <div class="keys">
        <button data-key="Enter">⏎</button><button data-key="Escape">Esc</button>
        <button data-key="C-c">^C</button><button data-key="Tab">Tab</button>
        <button data-key="S-Tab">⇧Tab</button>
        <button data-key="Up">↑</button><button data-key="Down">↓</button>
        <button data-text="1">1</button><button data-text="2">2</button><button data-text="3">3</button>
        <button data-text="y">y</button><button data-text="n">n</button>
      </div>
      <form class="send" id="sendForm">
        <textarea id="sendText" rows="2" placeholder="Orden para el agente… (Ctrl+Enter envía)"></textarea>
        <button class="btn" type="submit">Enviar</button>
      </form>
      <p class="hint">Clic en la terminal para teclear directo.</p>
    </section>

    <section class="tab tab-char" data-tab="char">
      <div class="char-grid" id="charGrid"></div>
      <div class="char-actions">
        <button class="btn" id="assignSlot">Solo este pane</button>
        <button class="btn" id="assignAgent">Todos los <span id="agentName"></span></button>
        <button class="btn ghost" id="assignClear">Quitar asignación</button>
      </div>
      <p class="hint" id="charSource"></p>
    </section>

    <section class="tab tab-hist" data-tab="hist">
      <div class="hist-filters">
        <label><input type="checkbox" value="input" checked> órdenes</label>
        <label><input type="checkbox" value="output" checked> salidas</label>
        <label><input type="checkbox" value="state"> estados</label>
        <label><input type="checkbox" value="key"> teclas</label>
      </div>
      <ol class="hist" id="hist"></ol>
      <button class="btn ghost" id="histMore">Más antiguo…</button>
    </section>
  </aside>

  <!-- Nueva sala -->
  <dialog id="newRoom" class="dlg">
    <form method="dialog" id="newRoomForm">
      <h2>Nueva sala</h2>
      <label>Nombre <input name="name" required pattern="[A-Za-z0-9_.\-]{1,64}" placeholder="api-refactor"></label>
      <label>Directorio <input name="cwd" placeholder="~/code/proyecto"></label>
      <label>Invocar
        <select name="command">
          <option value="claude">claude</option>
          <option value="codex">codex</option>
          <option value="">(solo shell)</option>
          <option value="__custom">otro comando…</option>
        </select>
      </label>
      <label class="custom-cmd" hidden>Comando <input name="custom"></label>
      <menu>
        <button class="btn ghost" value="cancel" formnovalidate>Cancelar</button>
        <button class="btn" value="ok">Abrir</button>
      </menu>
    </form>
  </dialog>

  <!-- Login -->
  <dialog id="login" class="dlg">
    <form method="dialog" id="loginForm">
      <h2>Contraseña del torreón</h2>
      <p class="muted">El <code>TD_AUTH_TOKEN</code> de tu <code>.env</code>.</p>
      <input name="token" type="password" required minlength="24" autocomplete="current-password">
      <menu><button class="btn" value="ok">Entrar</button></menu>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
